name: Build Firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: python -m pip install platformio==6.2.0

      - name: Set release date
        run: echo "RELEASE_TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Run PlatformIO
        run: platformio run

      - name: Run critical regression tests
        run: python3 tests/host/run.py

      - name: Set release tag
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: .pio/build/dc1/firmware.bin
