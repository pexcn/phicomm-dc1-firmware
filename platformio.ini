[platformio]
default_envs = dc1

[env]
framework                 = arduino
board                     = esp01_1m
board_build.f_cpu         = 80000000L
board_build.flash_mode    = dout
board_build.ldscript      = ld/eagle.flash.1m.dc1.ld
board_build.filesystem    = littlefs
board_upload.maximum_size = 954352

; Arduino ESP8266 core 3.1.2
platform                  = espressif8266@4.2.1
build_flags               = -D NDEBUG
                            -mtarget-align
                            -Wl,-Map,firmware.map
                            -DBEARSSL_SSL_BASIC
; lwIP 2 - Higher Bandwidth no Features
                            -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
; VTABLES in Flash
                            -DVTABLES_IN_FLASH
; No exception code in firmware
                            -fno-exceptions
                            -lstdc++

                            -D MQTT_MAX_PACKET_SIZE=768
                            -D MQTT_SOCKET_TIMEOUT=5

monitor_speed             = 115200
upload_speed              = 921600
; *** Upload Serial reset method for Wemos and NodeMCU
upload_resetmethod        = nodemcu
extra_scripts             = pre:scripts/embed-web.py
                            scripts/strip-floats.py
                            scripts/name-firmware.py

lib_deps =
  knolleary/PubSubClient@2.8.0
  Nanopb=https://github.com/nanopb/nanopb.git#nanopb-0.4.9.2

[env:dc1]
lib_deps                  = ${env.lib_deps}
                            plerup/EspSoftwareSerial@8.2.0
